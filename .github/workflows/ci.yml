# Builds libtsql with the parsers and the editor layer (TSQL_BUILD_PARSER) and runs ctest.
#   windows-msvc:   the way Calliper's Windows release builds it (Visual Studio generator, MSVC,
#                   static runtime, Release).
#   linux-gcc:      Ninja + GCC; also installs the package (with the parsers, and lexer-only) and
#                   builds and runs tests/install against each.
#   linux-asan:     Ninja + Clang, AddressSanitizer + UndefinedBehaviorSanitizer (LeakSanitizer on).
#   linux-tsan:     Ninja + Clang, ThreadSanitizer.
# The parser build fetches pinned SqlScriptDOM sources and the ANTLR 4.13.2 tool and runtime, and
# needs Java 11+ and Python 3 (both on the runner images).
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      # Test scripts are compared by byte offset; keep them byte-for-byte as committed.
      - name: Keep line endings
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
          cmake -S . -B build -DTSQL_BUILD_PARSER=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  linux-gcc:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTSQL_BUILD_PARSER=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Installed package
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/tsql"
          cmake -S tests/install -B build-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/tsql" -DTSQL_WITH_PARSER=ON
          cmake --build build-consumer
          build-consumer/lexer_consumer
          build-consumer/editor_consumer
      - name: Installed package, lexer only
        run: |
          cmake -S . -B build-lexer -G Ninja -DCMAKE_BUILD_TYPE=Release -DTSQL_BUILD_TESTS=OFF
          cmake --build build-lexer
          cmake --install build-lexer --prefix "$RUNNER_TEMP/tsql-lexer"
          cmake -S tests/install -B build-consumer-lexer -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/tsql-lexer"
          cmake --build build-consumer-lexer
          build-consumer-lexer/lexer_consumer

  # Clang 18 is the image's default Clang (runner-images Ubuntu2404-Readme: Clang 16.0.6, 17.0.6,
  # 18.1.3); its sanitizer runtimes are in libclang-rt-18-dev. A sanitized parser translation unit
  # takes several GB to compile: two at a time and three compiles in all fit the 16 GB runner.
  linux-sanitize:
    name: linux-${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan
            sanitize: address,undefined
          - name: tsan
            sanitize: thread
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ninja and the sanitizer runtimes
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libclang-rt-18-dev
      # The sanitizers of Clang 18 cannot map their shadow memory with the 32 bits of mmap
      # randomisation of the image's kernel.
      - name: Reduce mmap randomisation
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTSQL_BUILD_PARSER=ON
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          "-DCMAKE_CXX_FLAGS=-fsanitize=${{ matrix.sanitize }} -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=${{ matrix.sanitize }}
          -DTSQL_PARSER_COMPILE_JOBS=2
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test
        # test_document takes about a quarter of an hour under ThreadSanitizer: two tests at a time;
        # an hour stops a test that hangs
        run: ctest --test-dir build --output-on-failure --parallel 2 --timeout 3600
